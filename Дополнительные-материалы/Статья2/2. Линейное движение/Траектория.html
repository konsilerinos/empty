<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>/* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,
mtable.left-align mtd.right-align,
mtable.aligned mtd:nth-child(odd) {
  justify-items: end;
  text-align: right;
}
mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {
  justify-items: start;
  text-align: left;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.left-flush {
  padding-left: 0;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.right-flush {
  padding-right: 0;
}

/* Tables */
mtable {
  math-style: inherit;
}
mtd {
  math-depth: auto-add;
  math-style: compact;
  math-shift: compact;
}

/* Equations */
mtable.multiline-equation mtd {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
  padding: 0;
}
math > mtable.multiline-equation mtr:not(:last-child) mtd {
  padding-bottom: 0.5em;
}

/* Fractions */
mfrac {
  padding-inline: 0;
  margin-inline: 0.1em;
}

/* Accents */
mover[accent="true" i] > :first-child {
  font-feature-settings: "dtls";
}
mover.dotted[accent="true" i] > :first-child {
  font-feature-settings: "dtls" 0;
}

/* Other rules for scriptlevel, displaystyle and math-shift */
munder > :nth-child(2),
munderover > :nth-child(2) {
  math-shift: compact
}
munder[accentunder="true" i] > :not(:first-child),
mover[accent="true" i] > :not(:first-child) {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
}</style></head><body><h4>Описание траектории движения</h4><p>TODO: картинка</p><p>Движение начитается в точке <math><msub><mi>𝑃</mi><mn>1</mn></msub><mrow><mo>(</mo><mrow><msub><mi>𝑥</mi><mn>1</mn></msub><mo>,</mo><msub><mi>𝑦</mi><mn>1</mn></msub></mrow><mo>)</mo></mrow></math> и заканчивается в точке <math><msub><mi>𝑃</mi><mn>2</mn></msub><mrow><mo>(</mo><mrow><msub><mi>𝑥</mi><mn>2</mn></msub><mo>,</mo><msub><mi>𝑦</mi><mn>2</mn></msub></mrow><mo>)</mo></mrow></math>.</p><math display="block"><mi>𝒓</mi><mrow><mo>(</mo><mrow><mi>𝑢</mi><mrow><mo>(</mo><mi>𝑡</mi><mo>)</mo></mrow></mrow><mo>)</mo></mrow><mo>=</mo><mrow><mo>(</mo><mtable><mtr><mtd><msub><mi>𝑥</mi><mn>1</mn></msub></mtd></mtr><mtr><mtd><msub><mi>𝑦</mi><mn>1</mn></msub></mtd></mtr></mtable><mo>)</mo></mrow><mo>+</mo><mi>𝑢</mi><mrow><mo>(</mo><mi>𝑡</mi><mo>)</mo></mrow><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">⋅</mo><mrow><mo>(</mo><mtable><mtr><mtd><mi mathvariant="normal">Δ</mi><mi>𝑥</mi></mtd></mtr><mtr><mtd><mi mathvariant="normal">Δ</mi><mi>𝑦</mi></mtd></mtr></mtable><mo>)</mo></mrow><mo>,</mo><mi mathvariant="normal">Δ</mi><mi>𝑥</mi><mo>=</mo><msub><mi>𝑥</mi><mn>2</mn></msub><mo>−</mo><msub><mi>𝑥</mi><mn>1</mn></msub><mo>,</mo><mi mathvariant="normal">Δ</mi><mi>𝑦</mi><mo>=</mo><msub><mi>𝑦</mi><mn>2</mn></msub><mo>−</mo><msub><mi>𝑦</mi><mn>1</mn></msub></math><p>Без смещения время <math><mi>𝑡</mi><mo>∈</mo><mrow><mo>[</mo><mrow><mn>0</mn><mo>,</mo><msub><mi>𝑡</mi><mtext>dcc</mtext></msub></mrow><mo>]</mo></mrow></math></p></body></html>
