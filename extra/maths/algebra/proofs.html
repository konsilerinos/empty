<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>proofs.typ - Просмотр PDF</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
        .pdf-viewer {
            width: 100%;
            height: 80vh;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="../../logo.jpg" alt="Logo" width="48" height="48" onerror="this.style.display='none'">
        <div class="breadcrumbs">
            <a href="../../index.html">Extra</a> / <a href="../index.html">maths</a> / <a href="index.html">algebra</a> / <span>proofs.typ</span>
        </div>
    </div>
    <div class="wrapped-content-container">
        <!-- Важно: изначально src оставляем пустым, чтобы передать параметры целиком -->
        <iframe id="pdfPlayer" class="pdf-viewer"></iframe>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const iframe = document.getElementById('pdfPlayer');
        let pdfUrl = "proofs.pdf#toolbar=0&navpanes=0";
        
        // Проверяем, передал ли друг хэш в ссылке (например, #task-1)
        if (window.location.hash) {
            const targetLabel = window.location.hash.replace('#', '');
            // Дописываем официальный параметр Adobe PDF для перехода к метке
            pdfUrl += "&nameddest=" + encodeURIComponent(targetLabel);
        }
        
        // Только теперь инициализируем плеер
        iframe.src = pdfUrl;
    });
</script>
</body>
</html>
